name: Release Pages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-pages:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: kazlim-code/ci-workflows/.github/workflows/gleam-pages-deploy.yml@v1.0.1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      otp_version: "28.0"
      gleam_version: "1.19.2"
      rebar3_version: "3.28.0"
      export_module: "dev_ing_website/export"
      base_path_env: "DEV_ING_BASE_PATH"
      output_dir: "dist"
